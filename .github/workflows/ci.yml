name: CI

# Typecheck, lint, unit tests, reproducible plugin zip and the bundle-size
# budget (README F6: <= ~150 KiB gzipped).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build the plugin zip
        run: npm run package:geolibre

      - name: Reproducibility check
        run: |
          first=$(sha256sum geolibre-plugin/epidbot-*.zip | cut -d' ' -f1)
          npm run package:geolibre --silent >/dev/null
          second=$(sha256sum geolibre-plugin/epidbot-*.zip | cut -d' ' -f1)
          if [ "$first" != "$second" ]; then
            echo "::error::Plugin zip is not reproducible ($first != $second)."
            exit 1
          fi
          echo "Zip reproducible: $first"

      - name: Bundle size budget
        run: npm run check:size

      - name: Manifest/plugin identity consistency
        run: |
          node -e '
            const manifest = require("./geolibre-plugin/plugin.json");
            const pkg = require("./package.json");
            if (manifest.id !== "epidbot") throw new Error("unexpected plugin id");
            if (manifest.version !== pkg.version) {
              throw new Error(`plugin.json version ${manifest.version} != package.json ${pkg.version}`);
            }
          '
